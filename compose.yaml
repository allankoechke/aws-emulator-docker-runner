
services:
  aws-emulator:
    build:
      context: .
      dockerfile: Dockerfile
    image: aws-emulator:local
    container_name: aws-emulator
    restart: unless-stopped

    command: ["-p", "9297"]

    environment:
      HOME: /home/emulator
      EMULATOR_BIND_ADDRESS: 0.0.0.0
      EMULATOR_LISTENER_PORT_RANGE: 9298-9317

    ports:
      - "127.0.0.1:9297:9297"
      - "127.0.0.1:9298-9317:9298-9317"

    volumes:
      - aws-emulator-data:/home/emulator/.aws/emulator

    mem_limit: 2g
    memswap_limit: 2g

volumes:
  aws-emulator-data:
    name: aws-emulator-data
